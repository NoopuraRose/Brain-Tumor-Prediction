<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain MRI Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
    <main class="w-full max-w-lg rounded-2xl bg-white p-8 shadow-xl">
        <h1 class="text-center text-3xl font-bold text-slate-800">Brain MRI Prediction</h1>
        <p class="mt-2 text-center text-slate-500">Upload an MRI image to classify it with your trained model.</p>

        <form method="POST" enctype="multipart/form-data" class="mt-8 space-y-5">
            <div>
                <label for="mri_image" class="mb-2 block text-sm font-medium text-slate-700">
                    MRI image
                </label>
                <input
                    type="file"
                    id="mri_image"
                    name="mri_image"
                    accept=".png,.jpg,.jpeg,.webp"
                    required
                    class="w-full cursor-pointer rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-600 outline-none transition file:mr-4 file:rounded-md file:border-0 file:bg-indigo-100 file:px-4 file:py-2 file:font-semibold file:text-indigo-700 hover:file:bg-indigo-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2"
            >
                Predict MRI Class
            </button>
        </form>

        {% if image_url and label %}
            <div class="mt-6 overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
                <img src="{{ image_url }}" alt="Uploaded brain MRI" class="max-h-72 w-full object-contain">
                <div class="p-5 text-center">
                    <p class="text-sm font-medium uppercase tracking-wide text-slate-500">Prediction</p>
                    <p class="mt-1 text-3xl font-bold text-indigo-700">{{ label }}</p>
                    <p class="mt-2 text-slate-600">Confidence: {{ "%.2f"|format(confidence * 100) }}%</p>
                </div>
            </div>
        {% endif %}

        {% if error %}
            <div class="mt-6 rounded-lg bg-red-50 p-4 text-center text-red-700">
                {{ error }}
            </div>
        {% endif %}
    </main>
</body>
</html>
